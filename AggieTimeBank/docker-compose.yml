version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: timebank_mysql
    restart: always
    environment:
      # TODO: change to yout password
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: timebank
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password

  seed:
    build: ./backend
    depends_on:
      - db
